[project]
name = "argus-perception"
version = "0.1.0"
description = "ARGUS CV-Perception — datasets, training, ONNX export, calibration. The on-bus runtime is edge-app/ (Android)."
requires-python = ">=3.11"

dependencies = [
  # Inference for evaluation and the golden-frame reference. The same ONNX file ships
  # inside the edge-app APK (ONNX Runtime Android). See docs/03.
  "onnxruntime>=1.20",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",

  # Geometry and geo-referencing
  "pyproj>=3.6",          # projections for IPM → lat/lon
  "shapely>=2.0",         # map matching candidate geometry

  "pydantic>=2.9",        # models GENERATED from contracts/schemas — never hand-written

  "typer>=0.12",
  "pyyaml>=6.0",
  "structlog>=24.4",
]

[project.optional-dependencies]
# GPU evaluation on the training box. The phone runtime is the ONNX Runtime Android AAR,
# pulled by edge-app/'s Gradle build, not pip.
cuda    = ["onnxruntime-gpu>=1.20"]

# Training lives here rather than in a separate project so the export path and the
# runtime path share one dependency set and cannot drift on preprocessing.
train = [
  "torch>=2.5",
  "torchvision>=0.20",
  "onnx>=1.17",
  "onnxsim>=0.4",
  "pycocotools>=2.0",
  "albumentations>=1.4",
  "netcal>=1.3",          # confidence calibration — reliability diagrams, ECE
]

dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
